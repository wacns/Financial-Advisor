# Checklist: the app opens to the login screen with no error, and the demo workspace loads
# with its usual accounts and balances.
appId: com.wacns.financialadvisor
name: Launch and open the demo workspace
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome to FinancialAdvisor\.|Enter iPhone Passcode.*|.*Face ID.*'
    timeout: 120000
- runFlow: unlock-ios.yaml
- extendedWaitUntil:
    visible: 'Welcome to FinancialAdvisor\.'
    timeout: 60000
- takeScreenshot: launch-login
- runFlow: open-demo.yaml
# Demo total: 1,240.500 + 6,500.250 + 85.750.
- assertVisible: '.*7,826\.500.*'
- takeScreenshot: launch-overview
- tapOn: "Activity"
- assertVisible: '13 transactions.*'
- scrollUntilVisible:
    element: "Alosra supermarket"
    timeout: 30000
- scrollUntilVisible:
    element: "Monthly salary"
    timeout: 30000
- takeScreenshot: launch-activity
