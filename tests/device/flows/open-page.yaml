# Shared step: open a page from the phone navigation drawer ("More"). The drawer is its
# own scroll area just below the header (at most 390 points tall), so swipe inside it
# rather than in the middle of the screen, which would scroll the page behind it.
# Usage: runFlow with env PAGE set to the page's menu label.
appId: com.wacns.financialadvisor
---
- tapOn: "More"
- repeat:
    while:
      notVisible: ${PAGE}
    times: 15
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 22%
          duration: 600
- tapOn: ${PAGE}
