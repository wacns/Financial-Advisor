# Shared step: open the receipt scanner from the phone navigation drawer ("More"), swiping
# inside the drawer as open-settings.yaml does.
appId: com.wacns.financialadvisor
---
- tapOn: "More"
- repeat:
    while:
      notVisible: "Receipt scanner"
    times: 15
    commands:
      - swipe:
          start: 50%, 34%
          end: 50%, 17%
          duration: 600
- tapOn: "Receipt scanner"
