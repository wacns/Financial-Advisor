# Shared step: open Settings from the phone navigation drawer ("More"). The drawer is its
# own small scroll area between the header ("Toggle navigation") and the page heading
# ("YOUR MONEY, …"), so swipe inside it (from 34% to 17% of the screen height), slowly to
# avoid a fling. iOS reports drawer items scrolled out of that window as visible, at
# positions over the page, so an item only counts once it sits between those two anchors.
appId: com.wacns.financialadvisor
---
- tapOn: "More"
- repeat:
    while:
      notVisible:
        text: "Settings"
        below: "Toggle navigation"
        above: "YOUR MONEY.*"
    times: 15
    commands:
      - swipe:
          start: 50%, 34%
          end: 50%, 17%
          duration: 1500
- tapOn:
    text: "Settings"
    below: "Toggle navigation"
    above: "YOUR MONEY.*"
