# Shared step: open Settings from the phone navigation drawer ("More"). The drawer is its
# own scroll area just below the header (at most 390 points: about 12-37% of the screen
# height on the emulator and 15-60% on the simulator), so swipe inside it, from 34% to 17%,
# rather than in the middle of the screen, which would scroll the page behind it.
appId: com.wacns.financialadvisor
---
- tapOn: "More"
- repeat:
    while:
      notVisible: "Settings"
    times: 15
    commands:
      - swipe:
          start: 50%, 34%
          end: 50%, 17%
          duration: 600
- tapOn: "Settings"
