# Checklist: add an expense and the balance changes by the exact amount; it survives a
# restart; editing then deleting it returns the balance to where it was.
#
# The page-header "Add transaction" button is not used: on phones the next section of the
# page overlaps it and takes the tap (v1.7.1 too; see typescript-findings.md). Settings'
# "Quick expense" opens the same transaction form.
# Each form field shows a label above its input, and the input carries the same
# accessibility label, so `index: 1` targets the input.
appId: com.wacns.financialadvisor
name: Add, keep, edit and delete an expense
---
- runFlow: start-app.yaml
- runFlow: open-demo.yaml
- assertVisible: '.*7,826\.500.*'
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element: "Quick expense"
    timeout: 60000
- tapOn: "Quick expense"
- extendedWaitUntil:
    visible: "A new money moment"
    timeout: 20000
- tapOn:
    text: 'Amount \(BHD\)'
    index: 1
- inputText: "1.250"
# The keyboard can cover the next field on iOS.
- hideKeyboard
- tapOn:
    text: "Description"
    index: 1
- inputText: "CI coffee"
- hideKeyboard
- scrollUntilVisible:
    element: "Save"
    timeout: 20000
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "A new money moment"
    timeout: 20000
- tapOn: "Home"
- assertVisible: '.*7,825\.250.*'
- takeScreenshot: entry-added

# Restart the app: the entry and the balance are still there.
- runFlow: restart-app.yaml
- runFlow: open-demo.yaml
- assertVisible: '.*7,825\.250.*'
- tapOn: "Activity"
- scrollUntilVisible:
    element: "Edit CI coffee"
    timeout: 30000
- takeScreenshot: entry-after-restart

# Edit the amount to 2.000. The edit form labels the field "Amount".
- tapOn: "Edit CI coffee"
- extendedWaitUntil:
    visible: "Edit transaction"
    timeout: 20000
- tapOn:
    text: "Amount"
    index: 1
- eraseText
- inputText: "2.000"
- hideKeyboard
- scrollUntilVisible:
    element: "Save"
    timeout: 20000
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Edit transaction"
    timeout: 20000
- tapOn: "Home"
- assertVisible: '.*7,824\.500.*'
- takeScreenshot: entry-edited

# Delete it: the balance returns to the demo total.
- tapOn: "Activity"
- scrollUntilVisible:
    element: "Delete CI coffee"
    timeout: 30000
- tapOn: "Delete CI coffee"
- extendedWaitUntil:
    visible: "Confirm deletion"
    timeout: 20000
- tapOn:
    text: "Delete"
    below: "This reverses the transaction.*"
- extendedWaitUntil:
    notVisible: "Confirm deletion"
    timeout: 20000
- assertNotVisible: "Edit CI coffee"
- tapOn: "Home"
- assertVisible: '.*7,826\.500.*'
- takeScreenshot: entry-deleted
