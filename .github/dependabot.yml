# Dependabot version updates. Security updates are separate (repository settings) and are
# raised whenever an advisory affects a dependency, whatever this file says.
#
# - Expo and React Native packages must stay on the versions one Expo SDK expects, so they
#   are updated together, and major versions are left to an SDK upgrade (npx expo install
#   --fix), not individual bumps.
# - Versions in package.json are exact pins; Dependabot keeps them exact.
version: 2
updates:
  # The app: web, mobile, scripts, tests and tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '06:00'
      timezone: Asia/Bahrain
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-*/*'
          - 'react'
          - 'react-dom'
          - 'react-test-renderer'
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # The Electron desktop shell's own packages (electron-updater).
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: sunday
      time: '06:00'
      timezone: Asia/Bahrain
    open-pull-requests-limit: 3

  # Actions are pinned by commit; Dependabot updates the pin and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '06:00'
      timezone: Asia/Bahrain
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
