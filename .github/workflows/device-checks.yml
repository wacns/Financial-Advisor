# Runs the device checklist (docs/superpowers/specs/typescript-device-checklist.md) on an
# Android emulator and an iOS simulator, using the Maestro flows in tests/device/flows.
# Android reruns any failed flow on the released v1.7.1 APK, to tell a regression from a
# problem with the flow. Nothing is signed for release, published or released. Demo mode
# only: no real account is used.
#
# Layout: one build job per platform, then one test job per checklist flow, all running
# side by side on their own emulator or simulator, then a summary job with one table.
#
# Keeping time and Actions minutes low:
# - Runs only when app, native or test files change.
# - iOS runs only when the commit message contains [ios]: a macOS minute is billed as
#   10 Linux minutes on a private repository (a public one pays nothing).
# - The built APK and simulator app are cached by a hash of everything that goes into them
#   (APP_INPUTS below), so a push that changes only tests/device reuses the last build.
#   When the app does change, Gradle's build cache and (iOS) ccache and CocoaPods caches
#   speed the rebuild. The Android emulator boots from a cached snapshot.
# - v1.7.1 runs only for the flows that failed, so a passing run is a single pass.
# - Results are kept 3 days, without the screenshots (the app blocks screen capture, so
#   they are black; the screen hierarchy is what helps).
# Bump CACHE_VERSION to force fresh builds, for example after changing a build step.
name: Device checks
run-name: Device checks — ${{ github.ref_name }}
on:
  push:
    branches: [typescript-conversion]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/device/**'
      - 'app.config.ts'
      - 'native-entry.ts'
      - 'plugins/**'
      - 'modules/**'
      - 'native/**'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/device-checks.yml'
permissions:
  contents: read
concurrency:
  group: device-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  CACHE_VERSION: v1
  MAESTRO_VERSION: cli-2.10.0
  MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
  MAESTRO_CLI_NO_ANALYTICS: '1'
  # The iOS driver is built and started on first use; a cold CI simulator needs longer than the default.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  APP_UPDATE_CHANNEL: preview
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  # Builds the APK unless a build of these exact app files is cached, and makes sure the
  # emulator snapshot exists, so every test job starts from both.
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      apk-key: ${{ steps.apk.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # APP_INPUTS: everything the APK is built from.
      - name: Look for an APK built from these app files
        id: apk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/apk
          key: android-apk-${{ env.CACHE_VERSION }}-${{ hashFiles('src/**', 'assets/**', 'modules/**', 'native/**', 'plugins/**', 'app.config.ts', 'native-entry.ts', 'package.json', 'package-lock.json', 'eas.json', 'firebase.json', 'tsconfig*.json') }}
          lookup-only: true
      - name: Look for the emulator snapshot
        id: avd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.CACHE_VERSION }}-api34-google_apis-x86_64-pixel_6
          lookup-only: true
      # The build plus an emulator system image does not fit in the runner's free space.
      - name: Free disk space
        if: steps.apk.outputs.cache-hit != 'true' || steps.avd.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.apk.outputs.cache-hit != 'true'
        with: { node-version-file: '.nvmrc', cache: npm }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: steps.apk.outputs.cache-hit != 'true' || steps.avd.outputs.cache-hit != 'true'
        with: { distribution: temurin, java-version: '21' }
      - name: Use the runner's installed Android SDK
        if: steps.apk.outputs.cache-hit != 'true' || steps.avd.outputs.cache-hit != 'true'
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        if: steps.apk.outputs.cache-hit != 'true'
      - if: steps.apk.outputs.cache-hit != 'true'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - if: steps.apk.outputs.cache-hit != 'true'
        run: npm ci
      - name: Restore optional Firebase client config
        if: steps.apk.outputs.cache-hit != 'true'
        env: { FIREBASE_CONFIG: '${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}' }
        shell: bash
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" | base64 --decode > "$RUNNER_TEMP/google-services.json"
            jq -e . "$RUNNER_TEMP/google-services.json" > /dev/null
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi
      - if: steps.apk.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install
      # The Expo testing key signs this APK, as for preview releases. x86_64 only: the emulator's ABI.
      - name: Build the release APK
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: android
        run: ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process
      - name: Keep the APK and drop build intermediates
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/branch.apk"
          rm -rf android/app/build android/app/.cxx android/build
          df -h /
      - name: Save the APK for the test jobs and later runs
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/apk
          key: ${{ steps.apk.outputs.cache-primary-key }}
      - name: Enable KVM for the emulator
        if: steps.avd.outputs.cache-hit != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A booted emulator snapshot, so the test jobs skip the cold boot (the pattern the
      # emulator runner documents). Test runs never save over it.
      - name: Create the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot."
      - name: Save the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.cache-primary-key }}

  android-test:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: launch, flows: launch-demo }
          - { name: entry, flows: entry-lifecycle }
          - { name: settings, flows: settings }
          - { name: receipt, flows: receipt }
          # lock-on-return needs the background state lock-on-launch leaves behind.
          - { name: lock, flows: lock-on-launch lock-on-return }
    name: android (${{ matrix.name }})
    steps:
      # The emulator system image does not fit in the runner's free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Restore the APK
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/apk
          key: ${{ needs.android-build.outputs.apk-key }}
          fail-on-cache-miss: true
      - name: Restore the emulator snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.CACHE_VERSION }}-api34-google_apis-x86_64-pixel_6
      # Maestro runs on Java.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21' }
      - name: Use the runner's installed Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Download the released v1.7.1 APK for comparison
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/wacns/financial-advisor-releases/releases/download/v1.7.1
          name=FinancialAdvisor-1.7.1-android-preview.apk
          curl -fsSL -o "$RUNNER_TEMP/$name" "$base/$name"
          curl -fsSL -o "$RUNNER_TEMP/MOBILE-SHA256SUMS.txt" "$base/MOBILE-SHA256SUMS.txt"
          (cd "$RUNNER_TEMP" && grep " \*\?$name\$" MOBILE-SHA256SUMS.txt | sed 's/ \*/  /' | sha256sum -c -)
          echo "V171_APK=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ${{ matrix.flows }} (this branch, then v1.7.1 if it fails)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/device/android-ci.sh "$RUNNER_TEMP/apk/branch.apk" "$V171_APK" ${{ matrix.flows }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && hashFiles('device-results/**/results.tsv') != ''
        with:
          name: device-results-android-${{ matrix.name }}
          path: |
            device-results/
            !device-results/**/*.png
          retention-days: 3
      # A flow that fails on this branch but passes on v1.7.1 is a regression. One that fails
      # on both is a problem with the flow or the emulator, reported as a warning.
      - name: Compare with v1.7.1
        if: always()
        shell: bash
        run: |
          status=0
          while IFS=$'\t' read -r flow result; do
            # v1.7.1 only runs for flows that failed here, so its results may not exist.
            old=$(awk -F'\t' -v f="$flow" '$1 == f { print $2 }' device-results/android-v1.7.1/results.tsv 2>/dev/null || true)
            if [ "$result" = fail ] && [ "$old" = pass ]; then echo "::error::$flow fails on this branch but passes on v1.7.1"; status=1
            elif [ "$result" = fail ]; then echo "::warning::$flow fails on this branch and on v1.7.1 ($old); check the flow"; status=1
            fi
          done < device-results/android-branch/results.tsv
          exit $status

  # Builds the simulator app unless a build of these exact app files is cached.
  ios-build:
    if: contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      app-key: ${{ steps.app.outputs.cache-primary-key }}
      xcode: ${{ steps.xcode.outputs.version }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with: { xcode-version: latest-stable }
      # Part of the build cache keys: a new Xcode means a fresh build.
      - name: Read the Xcode version
        id: xcode
        # "Xcode 26.2" and "Build version 17C52" become "26.2-17C52".
        run: echo "version=$(xcodebuild -version | awk 'NR==1{v=$2} NR==2{b=$3} END{print v "-" b}')" >> "$GITHUB_OUTPUT"
      # APP_INPUTS plus the Xcode version: everything the simulator app is built from.
      - name: Look for an app built from these app files
        id: app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ios-app
          key: ios-app-adhoc-${{ env.CACHE_VERSION }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('src/**', 'assets/**', 'modules/**', 'native/**', 'plugins/**', 'app.config.ts', 'native-entry.ts', 'package.json', 'package-lock.json', 'eas.json', 'firebase.json', 'tsconfig*.json', 'scripts/verify-ios-inputs.ts') }}
          lookup-only: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.app.outputs.cache-hit != 'true'
        with: { node-version-file: '.nvmrc', cache: npm }
      - if: steps.app.outputs.cache-hit != 'true'
        run: npm ci
      # This test fails only on Windows (path separators); a Mac runs it for real.
      - if: steps.app.outputs.cache-hit != 'true'
        run: npx tsc -p desktop/tsconfig.policy.json && node --test tests/unit/ios-inputs.test.ts
      - name: Restore optional Firebase iOS client configuration
        if: steps.app.outputs.cache-hit != 'true'
        env: { FIREBASE_IOS_CONFIG_B64: '${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}' }
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_IOS_CONFIG_B64" ]; then
            printf '%s' "$FIREBASE_IOS_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/GoogleService-Info.plist"
            plutil -lint "$RUNNER_TEMP/GoogleService-Info.plist"
            echo "GOOGLE_SERVICE_INFO_PLIST=$RUNNER_TEMP/GoogleService-Info.plist" >> "$GITHUB_ENV"
          fi
      - name: Generate and check the iOS project
        if: steps.app.outputs.cache-hit != 'true'
        env: { CI: '1' }
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install
          node scripts/verify-ios-inputs.ts ios
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 native/ios/FinancialAdvisorIntents.swift
      - name: Restore CocoaPods and the compiler cache
        if: steps.app.outputs.cache-hit != 'true'
        id: build-caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ios/Pods
            .ccache
          key: ios-build-caches-${{ env.CACHE_VERSION }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('package-lock.json', 'app.config.ts', 'plugins/**', 'modules/**') }}-${{ github.sha }}
          restore-keys: |
            ios-build-caches-${{ env.CACHE_VERSION }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('package-lock.json', 'app.config.ts', 'plugins/**', 'modules/**') }}-
            ios-build-caches-${{ env.CACHE_VERSION }}-xcode${{ steps.xcode.outputs.version }}-
      # USE_CCACHE makes React Native's pod setup compile through ccache.
      - name: Install pods with ccache
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: ios
        env: { USE_CCACHE: '1' }
        run: |
          brew install ccache
          ccache --zero-stats
          pod install
      # Signed ad hoc ("Sign to Run Locally"), which needs no Apple account. Turning signing off
      # entirely also drops the entitlements, and the keychain (expo-secure-store) then fails
      # with "A required entitlement isn't present".
      - name: Build the release app for the simulator
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build | tail -n 50
          ccache --show-stats || true
          app=$(ls -d build/ios/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          test -d "$app"
          mkdir -p build/ios-app
          cp -R "$app" build/ios-app/
      - name: Save the app for the test jobs and later runs
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ios-app
          key: ${{ steps.app.outputs.cache-primary-key }}
      - name: Save CocoaPods and the compiler cache
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ios/Pods
            .ccache
          key: ${{ steps.build-caches.outputs.cache-primary-key }}

  ios-test:
    needs: ios-build
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flow: [launch-demo, entry-lifecycle, settings, receipt]
    name: ios (${{ matrix.flow }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # The same Xcode as the build, so the simulator runtime matches.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with: { xcode-version: latest-stable }
      - name: Restore the app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ios-app
          key: ${{ needs.ios-build.outputs.app-key }}
          fail-on-cache-miss: true
      # Maestro runs on Java.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21' }
      # An iPhone on the newest installed iOS runtime, which is the one the selected Xcode tests against.
      - name: Pick and boot an iPhone simulator
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          echo "Runtime: $runtime"
          udid=$(xcrun simctl list devices available -j | jq -r --arg r "$runtime" '[(.devices[$r] // [])[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$udid" && test "$udid" != null
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "IOS_APP=$(ls -d build/ios-app/*.app | head -n 1)" >> "$GITHUB_ENV"
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Run ${{ matrix.flow }}
        run: bash tests/device/run-ios.sh branch "$IOS_APP" "$SIM_UDID" device-results/ios-branch ${{ matrix.flow }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && hashFiles('device-results/**/results.tsv') != ''
        with:
          name: device-results-ios-${{ matrix.flow }}
          path: |
            device-results/
            !device-results/**/*.png
          retention-days: 3
      - name: Fail if the flow failed
        if: always()
        run: |
          if grep -q $'\tfail$' device-results/ios-branch/results.tsv 2>/dev/null; then
            grep $'\tfail$' device-results/ios-branch/results.tsv | cut -f1 | sed 's/^/::error::fails on iOS: /'
            exit 1
          fi

  # One pass/fail table for the whole checklist, from every test job's results.
  summary:
    needs: [android-test, ios-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, sparse-checkout: tests/device }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'device-results-*', path: all-results }
      - name: Write the summary
        run: |
          bash tests/device/merge-results.sh all-results merged
          if [ -f merged/android-branch/results.tsv ]; then
            bash tests/device/summary.sh "Android emulator (API 34)" "This branch=merged/android-branch" "v1.7.1=merged/android-v1.7.1" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f merged/ios-branch/results.tsv ]; then
            bash tests/device/summary.sh "iOS simulator (no v1.7.1 comparison, since the release IPA is built for devices)" "This branch=merged/ios-branch" >> "$GITHUB_STEP_SUMMARY"
          fi
