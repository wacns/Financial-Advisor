name: Publish public mobile installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing private release version (without v)
        required: true
        default: '1.6.0'
        type: string
      release_version:
        description: Public release version (blank uses current desktop version)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_version:
        required: false
        type: string
    secrets:
      RELEASES_TOKEN:
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: public-mobile-downloads
  cancel-in-progress: false
jobs:
  publish:
    env:
      RELEASE_HISTORY_FILE: /tmp/financial-advisor-release-history.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: '.nvmrc', package-manager-cache: false }
      - name: Download existing private mobile release
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'if (!/^\d+\.\d+\.\d+$/.test(process.env.MOBILE_RELEASE_VERSION)) process.exit(1)'
          gh release download "v$MOBILE_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir mobile-installers --pattern '*.apk' --pattern '*.aab' --pattern '*.ipa' --pattern SHA256SUMS.txt
      - name: Generate changelog from source commits and merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_VERSION: ${{ inputs.release_version }}
        run: node scripts/generate-release-history.ts
      - name: Publish verified mobile installers to public repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          MOBILE_RELEASE_VERSION: ${{ inputs.version }}
          PUBLIC_RELEASE_VERSION: ${{ inputs.release_version }}
        run: node scripts/publish-mobile.ts mobile-installers
      - name: Publish changelog and release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_NOTES_VERSION: ${{ inputs.release_version }}
        run: node scripts/publish-release-notes.ts
