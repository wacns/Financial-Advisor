name: Publish mobile update
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Installed build channel
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Describe the compatible JavaScript/assets change
        type: string
        required: true
permissions: { contents: read }
concurrency:
  group: mobile-update-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    environment: mobile-${{ inputs.channel }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      APP_UPDATE_CHANNEL: ${{ inputs.channel }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: '.nvmrc', cache: npm }
      - name: Verify update project setup
        run: test -n "$EXPO_TOKEN"
      - run: npm ci
      - run: npm run lint && npm test
      - name: Match optional Firebase configuration used by the installed binary
        env:
          ANDROID_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          IOS_CONFIG: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_CONFIG" ]; then
            printf '%s' "$ANDROID_CONFIG" | base64 --decode > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi
          if [ -n "$IOS_CONFIG" ]; then
            printf '%s' "$IOS_CONFIG" | base64 --decode > "$RUNNER_TEMP/GoogleService-Info.plist"
            echo "GOOGLE_SERVICE_INFO_PLIST=$RUNNER_TEMP/GoogleService-Info.plist" >> "$GITHUB_ENV"
          fi
      - name: Publish compatible mobile update
        env: { UPDATE_MESSAGE: '${{ inputs.message }}', UPDATE_CHANNEL: '${{ inputs.channel }}' }
        run: npx --yes eas-cli@25.2.0 update --channel "$UPDATE_CHANNEL" --message "$UPDATE_MESSAGE" --environment "$UPDATE_CHANNEL" --non-interactive
