name: Application releases
run-name: FinancialAdvisor installers — ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run lint && npm test
      - id: version
        env: { RELEASE_REF: '${{ github.ref }}' }
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {releaseNotes} from './scripts/release-notes.mjs';
          import app from './app.config.ts';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const desktop = JSON.parse(fs.readFileSync('desktop/package.json'));
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || app.expo.version !== pkg.version || desktop.version !== pkg.version) throw Error('All app versions must match');
          if (process.env.RELEASE_REF.startsWith('refs/tags/') && process.env.RELEASE_REF !== `refs/tags/v${pkg.version}`) throw Error('Tag must match package version');
          releaseNotes(pkg.version);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${pkg.version}\n`);
          JS
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      APP_UPDATE_CHANNEL: preview
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: '.nvmrc', cache: npm }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21' }
      - name: Use the runner's installed Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - name: Restore optional Firebase client config
        env: { FIREBASE_CONFIG: '${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}' }
        shell: bash
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" | base64 --decode > "$RUNNER_TEMP/google-services.json"
            jq -e . "$RUNNER_TEMP/google-services.json" > /dev/null
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi
      - run: npx expo prebuild --platform android --no-install
      - name: Restore optional Android release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            for value in "$KEYSTORE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do test -n "$value"; done
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo 'ANDROID_SIGNATURE=release' >> "$GITHUB_ENV"
          else
            echo '::warning::No release keystore configured. APK/AAB use the Expo testing key; do not use this key for production.'
            echo 'ANDROID_SIGNATURE=preview' >> "$GITHUB_ENV"
          fi
      - name: Check Android manifest merging before native compilation
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:processReleaseMainManifest --build-cache --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process
      - name: Build APK and Play Store bundle
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --build-cache --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process
      - name: Verify and collect Android installers
        env: { APP_VERSION: '${{ needs.verify.outputs.version }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installers
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | sed -n '1,5p'
          cp "$APK" "installers/FinancialAdvisor-$APP_VERSION-android-$ANDROID_SIGNATURE.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "installers/FinancialAdvisor-$APP_VERSION-android-$ANDROID_SIGNATURE.aab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: android-installers, path: 'installers/*', retention-days: 7, if-no-files-found: error }
  ios:
    needs: verify
    permissions: { contents: write }
    uses: ./.github/workflows/ios-build.yml
    with:
      build_id: FinancialAdvisor-${{ needs.verify.outputs.version }}-ios-unsigned
      configuration: Release
      use_signing: false
    secrets: inherit
  desktop:
    needs: verify
    uses: ./.github/workflows/build-desktop.yml
  publish:
    needs: [verify, android, ios, desktop]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { path: installers, merge-multiple: true }
      - name: Publish preview with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          sha256sum -- * > SHA256SUMS.txt
          cd ..
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {releaseNotes} from './scripts/release-notes.mjs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, releaseNotes(process.env.APP_VERSION));
          JS
          TAG="v$APP_VERSION"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true || { echo 'Refusing to replace a published release. Bump the app version.' >&2; exit 1; }
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" installers/* --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false --title "$TAG"
  public-desktop:
    needs: [verify, publish]
    uses: ./.github/workflows/publish-desktop.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    secrets:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
  public-mobile:
    needs: [verify, public-desktop]
    uses: ./.github/workflows/publish-mobile.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      release_version: ${{ needs.verify.outputs.version }}
    secrets:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
